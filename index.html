<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111014">
<title>Фит дневник</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%23f2677a'/%3E%3Cpath fill='%23fff' d='M54,78C54,78 30,63.5 30,46.5C30,38.5 36,33 43,33C47.8,33 51.6,35.6 54,39.4C56.4,35.6 60.2,33 65,33C72,33 78,38.5 78,46.5C78,63.5 54,78 54,78Z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#111014; --surface:#1b1a20; --surface2:#25232c; --line:#302e38;
  --text:#f5f3f7; --muted:#9d98a8; --faint:#6d6878;
  --accent:#ff7a8a; --accent-ink:#1a0d10; --accent-soft:rgba(255,122,138,.15);
  --pos:#4fd6a0; --pos-soft:rgba(79,214,160,.14);
  --warn:#ffb35c; --warn-soft:rgba(255,179,92,.14);
  --prot:#8fa3ff; --prot-soft:rgba(143,163,255,.16);
  --water:#5cc8ff; --water-soft:rgba(92,200,255,.14);
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f7f3f1; --surface:#ffffff; --surface2:#f1ebe8; --line:#e7dfdb;
    --text:#1f1b24; --muted:#6f6879; --faint:#9a93a2;
    --accent:#e0506a; --accent-ink:#fff; --accent-soft:rgba(224,80,106,.1);
    --pos:#178a60; --pos-soft:rgba(23,138,96,.1);
    --warn:#b86a0c; --warn-soft:rgba(184,106,12,.1);
    --prot:#4a61d1; --prot-soft:rgba(74,97,209,.1);
    --water:#1a86be; --water-soft:rgba(26,134,190,.1);
    --shadow:0 14px 30px -18px rgba(60,30,40,.35);
  }
}
:root[data-theme="light"]{
  --bg:#f7f3f1; --surface:#ffffff; --surface2:#f1ebe8; --line:#e7dfdb;
  --text:#1f1b24; --muted:#6f6879; --faint:#9a93a2;
  --accent:#e0506a; --accent-ink:#fff; --accent-soft:rgba(224,80,106,.1);
  --pos:#178a60; --pos-soft:rgba(23,138,96,.1);
  --warn:#b86a0c; --warn-soft:rgba(184,106,12,.1);
  --prot:#4a61d1; --prot-soft:rgba(74,97,209,.1);
  --water:#1a86be; --water-soft:rgba(26,134,190,.1);
  --shadow:0 14px 30px -18px rgba(60,30,40,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .warn{color:var(--warn)} .prot{color:var(--prot)}

/* header */
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.topbar h1{font-size:22px;flex:1}
.datenav{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.datenav .dt{flex:1;text-align:center;min-width:0}
.datenav .dt b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datenav .dt span{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--text);flex:none}
.iconbtn:disabled{opacity:.3}
.iconbtn svg{width:20px;height:20px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:12px;color:var(--muted);font-size:11px}
.wd b{font-size:15px;color:var(--text);font-weight:650}
.wd i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.wd i.ok{background:var(--pos)} .wd i.over{background:var(--warn)}
.wd.sel{background:var(--surface)} .wd.sel b{color:var(--accent)}
.wd:disabled{opacity:.35}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:16px;margin:12px 0}
.card h2{font-size:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px}
.sec h2{font-size:17px}
.linkbtn{color:var(--accent);font-weight:650;font-size:14px;padding:6px 2px}

.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.ringbox{position:relative;display:grid;place-items:center}
.ringbox svg{width:100%;max-width:150px;height:auto;display:block}
.ringbox .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rc b{font-size:24px;font-weight:800;line-height:1.1}
.rc span{font-size:12px;color:var(--muted)}
.rc em{font-style:normal;font-size:12px;font-weight:650;margin-top:2px}
.ringlabel{text-align:center;font-size:13px;color:var(--muted);margin-top:2px}

.balance{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bigval{font-size:30px;font-weight:800;line-height:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--surface2);color:var(--muted)}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.breakdown{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.weekline{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}

.tip{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:18px;padding:14px 16px;margin:12px 0}
.tip .em{font-size:22px;line-height:1.2}
.tip p{margin:0;font-size:15px}
.tip p + p{margin-top:6px}

.routine{display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--line);border-radius:18px;padding:14px;margin:10px 0}
.routine .rt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.routine .rt b{font-size:15px}
.btnrow{display:flex;gap:8px}
.btnrow > *{flex:1}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.tile .tl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .tv{font-size:22px;font-weight:800}
.tile .ts{font-size:12px;color:var(--muted)}
.water-ctrl{display:flex;align-items:center;gap:8px;margin-top:auto}
.water-ctrl button{width:34px;height:34px;border-radius:11px;background:var(--water-soft);color:var(--water);font-size:20px;font-weight:700}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px}

.meal{background:var(--surface);border-radius:18px;margin:10px 0;overflow:hidden}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 6px;width:100%;text-align:left}
.meal-h b{font-size:15px}
.meal-h .mt{font-size:13px;color:var(--muted)}
.meal ul{list-style:none;margin:0;padding:0 14px 10px}
.meal li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;color:var(--muted)}
.meal li span:first-child{color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal li span:last-child{white-space:nowrap}
.meal-actions{display:flex;gap:4px;padding:0 10px 10px}
.meal-actions button{font-size:13px;color:var(--muted);padding:6px 8px;border-radius:10px;background:var(--surface2)}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:16px;margin:8px 0;width:100%;text-align:left}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow span{font-size:13px;color:var(--muted)}
.row .end{text-align:right;font-size:14px;white-space:nowrap}
.row .end small{display:block;color:var(--muted);font-size:12px}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.03em}

.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;font-size:26px;padding:8px 0;border-radius:14px;background:var(--surface2);filter:grayscale(.85);opacity:.6}
.moods button.on{filter:none;opacity:1;background:var(--accent-soft);outline:2px solid var(--accent)}
textarea,input[type=text],input[type=number],input[type=search],input[type=time],input[type=date],select,input:not([type]){
  width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:none;font-size:16px}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:14px;background:var(--surface2);font-weight:650;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.pos{background:var(--pos-soft);color:var(--pos)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn-soft)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:650;color:var(--faint)}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:var(--accent)}
#fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(82px + env(safe-area-inset-bottom));z-index:31;height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
#fab svg{width:22px;height:22px}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;box-shadow:var(--shadow)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sheet-h h3{flex:1;font-size:18px}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f > *{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sumline{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);margin:10px 0;font-weight:650}
.qty-big{display:flex;align-items:baseline;gap:8px;justify-content:center;margin:14px 0 6px}
.qty-big b{font-size:34px;font-weight:800}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);margin:6px 0}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .grow span{font-size:13px;color:var(--muted)}
.item .x{width:32px;height:32px;border-radius:10px;color:var(--muted);font-size:20px}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.res .grow{flex:1;min-width:0}
.res .grow b{display:block;font-weight:600;font-size:15px}
.res .grow span{font-size:12.5px;color:var(--muted)}
.res .end{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.gh{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 4px 4px}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.actions3 .btn{flex-direction:column;gap:2px;font-size:13px;padding:10px 4px;min-height:58px}
.actions3 .btn span{font-size:20px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:14px;padding:10px 12px;margin:10px 0}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--text);border-radius:16px;padding:10px 12px;margin:10px 0;font-size:14px}
.banner .grow{flex:1}

/* stats */
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.st{background:var(--surface);border-radius:18px;padding:14px}
.st .l{font-size:12.5px;color:var(--muted)}
.st .v{font-size:24px;font-weight:800;margin-top:2px}
.st .s{font-size:12px;color:var(--muted);margin-top:2px}
.chart{margin-top:6px}
.chart-tip{font-size:13px;color:var(--muted);min-height:20px;margin-bottom:4px}
.chart-tip b{color:var(--text)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--faint);font-family:var(--font)}
.chart .col{fill:transparent}
.chart .col.on{fill:var(--surface2)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:650;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1}
video.scan{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
.hidden{display:none!important}
</style>
</head>
<body>
<header id="top"><div class="wrap" id="topin"></div></header>
<main class="wrap" id="view"></main>
<button id="fab" class="hidden" aria-label="Додај оброк"></button>
<nav id="tabs"><div class="in" id="tabsin"></div></nav>
<div id="toast"></div>

<script src="foods.js"></script>
<script>
'use strict';
/* ================= основно ================= */
const KEY = 'fitdnevnik.v1';
const SLOTS = ['Доручак', 'Ужина', 'Ручак', 'Пре тренинга', 'Вечера', 'Касна ужина', 'Кафа / пиће'];
const DAY_SHORT = ['Пон', 'Уто', 'Сре', 'Чет', 'Пет', 'Суб', 'Нед'];
const DAY_LONG = ['Понедељак', 'Уторак', 'Среда', 'Четвртак', 'Петак', 'Субота', 'Недеља'];
const MONTHS = ['јануар', 'фебруар', 'март', 'април', 'мај', 'јун', 'јул', 'август', 'септембар', 'октобар', 'новембар', 'децембар'];
const MOODS = ['😫', '😕', '😐', '🙂', '🤩'];

const ICON = {
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5l7 7-7 7"/></svg>',
  close: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>',
  today: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M12 7.5V12l3 2"/></svg>',
  food: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 3v8M4.5 3v5a2.5 2.5 0 005 0V3M7 11v10M17 21V3c-2.5 1.5-3.5 4.5-3.5 8h3.5"/></svg>',
  stats: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V11M10 20V5M15 20v-7M20 20V9"/></svg>',
  cog: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 00.3 1.8l.1.1a2 2 0 11-2.8 2.8l-.1-.1a1.7 1.7 0 00-1.8-.3 1.7 1.7 0 00-1 1.5V21a2 2 0 11-4 0v-.1a1.7 1.7 0 00-1.1-1.5 1.7 1.7 0 00-1.8.3l-.1.1a2 2 0 11-2.8-2.8l.1-.1a1.7 1.7 0 00.3-1.8 1.7 1.7 0 00-1.5-1H3a2 2 0 110-4h.1a1.7 1.7 0 001.5-1.1 1.7 1.7 0 00-.3-1.8l-.1-.1a2 2 0 112.8-2.8l.1.1a1.7 1.7 0 001.8.3H9a1.7 1.7 0 001-1.5V3a2 2 0 114 0v.1a1.7 1.7 0 001 1.5 1.7 1.7 0 001.8-.3l.1-.1a2 2 0 112.8 2.8l-.1.1a1.7 1.7 0 00-.3 1.8V9a1.7 1.7 0 001.5 1H21a2 2 0 110 4h-.1a1.7 1.7 0 00-1.5 1z"/></svg>'
};

function defaults() {
  return {
    v: 1,
    profile: { sex: 'f', age: null, height: null, weight: null, level: 1.2, target: null, protMin: null, protMax: null, water: 2250, glass: 250 },
    settings: { script: 'cyr', theme: 'auto', showWeight: false, lastBackup: 0, onboarded: false },
    foods: {}, routines: [], days: {}, recent: [], usage: {}
  };
}
function normalize(s) {
  const d = defaults();
  return {
    ...d, ...s,
    profile: { ...d.profile, ...(s.profile || {}) },
    settings: { ...d.settings, ...(s.settings || {}) },
    foods: s.foods || {}, routines: s.routines || [], days: s.days || {}, recent: s.recent || [], usage: s.usage || {}
  };
}
function load() {
  try {
    const s = JSON.parse(localStorage.getItem(KEY));
    if (s && s.days) return normalize(s);
  } catch (e) { }
  return defaults();
}
let S = load();
function save() {
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) { toast('Грешка при чувању података!'); }
}

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const num = v => { const n = parseFloat(String(v ?? '').replace(',', '.').replace(/\s/g, '')); return isFinite(n) ? n : NaN; };
function fmt(n, dec = 0) {
  if (n == null || !isFinite(n)) return '—';
  const neg = n < 0; n = Math.abs(n);
  let [i, f] = n.toFixed(dec).split('.');
  i = i.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  if (f && /^0+$/.test(f)) f = '';
  return (neg ? '−' : '') + i + (f ? ',' + f : '');
}
const signed = n => (n > 0 ? '+' : '') + fmt(n);

/* ћирилица → латиница */
const LAT = { а:'a',б:'b',в:'v',г:'g',д:'d',ђ:'đ',е:'e',ж:'ž',з:'z',и:'i',ј:'j',к:'k',л:'l',љ:'lj',м:'m',н:'n',њ:'nj',о:'o',п:'p',р:'r',с:'s',т:'t',ћ:'ć',у:'u',ф:'f',х:'h',ц:'c',ч:'č',џ:'dž',ш:'š',
  А:'A',Б:'B',В:'V',Г:'G',Д:'D',Ђ:'Đ',Е:'E',Ж:'Ž',З:'Z',И:'I',Ј:'J',К:'K',Л:'L',Љ:'Lj',М:'M',Н:'N',Њ:'Nj',О:'O',П:'P',Р:'R',С:'S',Т:'T',Ћ:'Ć',У:'U',Ф:'F',Х:'H',Ц:'C',Ч:'Č',Џ:'Dž',Ш:'Š' };
const toLat = s => String(s).replace(/[Ѐ-ӿ]/g, c => LAT[c] ?? c);
const L = s => S.settings.script === 'lat' ? toLat(s) : s;
const norm = s => toLat(s).toLowerCase().replace(/đ/g, 'dj').normalize('NFD').replace(/[̀-ͯ]/g, '');

/* датуми */
const pad2 = n => String(n).padStart(2, '0');
const keyOf = d => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const todayKey = () => keyOf(new Date());
const parseKey = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
const addDays = (k, n) => { const d = parseKey(k); d.setDate(d.getDate() + n); return keyOf(d); };
const wd = k => (parseKey(k).getDay() + 6) % 7;
const nowTime = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
function dateLabel(k) {
  const t = todayKey();
  if (k === t) return 'Данас';
  if (k === addDays(t, -1)) return 'Јуче';
  return DAY_LONG[wd(k)];
}
function dateLong(k) { const d = parseKey(k); return d.getDate() + '. ' + MONTHS[d.getMonth()] + ' ' + d.getFullYear() + '.'; }
const dateShort = k => { const d = parseKey(k); return d.getDate() + '.' + (d.getMonth() + 1) + '.'; };

/* ================= база хране ================= */
const BASE = [];
const BASE_MAP = {};
for (const [cat, list] of Object.entries(window.FOOD_BASE || {})) {
  for (const [name, kcal, p, unit, portion] of list) {
    const f = { id: 'b:' + name, name, kcal, p, unit, portion, cat, src: 'base' };
    BASE.push(f); BASE_MAP[f.id] = f;
  }
}
const ACTS = (window.ACTIVITY_BASE || []).map(([name, met]) => ({ name, met }));
const getFood = id => S.foods[id] || BASE_MAP[id] || null;
const allFoods = () => [...Object.values(S.foods), ...BASE];
const unitOf = f => f.unit === 'ml' ? 'ml' : 'g';

function searchFoods(q, limit = 40) {
  const words = norm(q).split(/\s+/).filter(Boolean);
  if (!words.length) return [];
  const out = [];
  for (const f of allFoods()) {
    const n = norm(f.name + ' ' + (f.brand || ''));
    if (!words.every(w => n.includes(w))) continue;
    let score = (S.usage[f.id] || 0) * 3 + (f.src !== 'base' ? 20 : 0);
    if (n.startsWith(words[0])) score += 15;
    if (n.split(/[\s/(),]+/).some(t => t.startsWith(words[0]))) score += 5;
    out.push([score, f]);
  }
  out.sort((a, b) => b[0] - a[0] || a[1].name.length - b[1].name.length);
  return out.slice(0, limit).map(x => x[1]);
}
function makeItem(f, g) {
  return { fid: f.id, name: f.name, g: Math.round(g * 10) / 10, unit: unitOf(f), kcal: Math.round(f.kcal * g / 10) / 10, p: Math.round(f.p * g / 10) / 10 };
}
function noteUse(items) {
  for (const it of items) {
    if (!it.fid) continue;
    S.usage[it.fid] = (S.usage[it.fid] || 0) + 1;
    S.recent = [it.fid, ...S.recent.filter(x => x !== it.fid)].slice(0, 40);
  }
}
const itemLine = it => it.fid ? fmt(it.g) + ' ' + (it.unit || 'g') : 'ручно';

/* ================= математика ================= */
function peek(k) { return S.days[k] || null; }
function day(k) {
  if (!S.days[k]) S.days[k] = { meals: [], acts: [], skip: [], steps: null, water: 0, weight: null, mood: null, note: '' };
  const d = S.days[k]; d.meals ||= []; d.acts ||= []; d.skip ||= [];
  return d;
}
function estWeight() { const h = (S.profile.height || 168) / 100; return Math.round(23 * h * h); }
function weightOn(k) {
  let best = null, bk = '';
  for (const [dk, d] of Object.entries(S.days)) if (d.weight && dk <= k && dk > bk) { bk = dk; best = d.weight; }
  return best || S.profile.weight || estWeight();
}
function bmr(w) {
  const p = S.profile, a = p.age || 40, h = p.height || 168;
  return 10 * w + 6.25 * h - 5 * a + (p.sex === 'm' ? 5 : -161);
}
// Корак ≈ 0,00044 kcal по кг изнад мировања (ходање ~100 корака/мин, MET 3,5).
const stepsKcal = (steps, w) => (steps || 0) * w * 0.00044;
// Потрошња вежбе изнад мировања (мировање се рачуна посебно, па се не броји двапут).
const actKcal = (met, min, w, int = 1) => Math.max(0, met * int - 1) * 3.5 * w / 200 * min;
function suggestTarget(w) { return Math.max(1200, Math.round((bmr(w) * 1.5 - 500) / 50) * 50); }
function target() { return S.profile.target || suggestTarget(weightOn(todayKey())); }
function protRange() {
  const w = weightOn(todayKey());
  const lo = S.profile.protMin || Math.round(w * 1.3 / 5) * 5;
  const hi = S.profile.protMax || Math.max(lo, Math.round(w * 1.5 / 5) * 5);
  return [lo, hi];
}
function calc(k) {
  const d = peek(k) || { meals: [], acts: [], skip: [] };
  const w = weightOn(k);
  let kcal = 0, p = 0;
  for (const m of d.meals || []) for (const it of m.items) { kcal += it.kcal || 0; p += it.p || 0; }
  const rest = bmr(w) * (S.profile.level || 1.2);
  const st = stepsKcal(d.steps, w);
  let ak = 0, amin = 0;
  for (const a of d.acts || []) { ak += a.kcal || 0; amin += a.min || 0; }
  const exp = rest + st + ak;
  return { k, d, w, kcal, p, rest, st, ak, amin, exp, bal: kcal - exp, logged: (d.meals || []).length > 0, steps: d.steps || 0, water: d.water || 0 };
}
function lastDays(endK, n) { const out = []; for (let i = n - 1; i >= 0; i--) out.push(addDays(endK, -i)); return out; }
function weekBalance(endK) {
  let sum = 0, n = 0;
  for (const k of lastDays(endK, 7)) { const c = calc(k); if (c.logged) { sum += c.bal; n++; } }
  return { sum, n };
}
const routinesOn = k => S.routines.filter(r => (r.days || []).includes(wd(k)));
function routineState(k, r) {
  const d = peek(k);
  if (!d) return 'pending';
  if ((d.acts || []).some(a => a.rid === r.id)) return 'done';
  if ((d.skip || []).includes(r.id)) return 'skip';
  return 'pending';
}
const inTarget = c => c.logged && c.kcal <= target() + 50;

/* ================= UI стање и навигација ================= */
const ui = { tab: 'today', date: todayKey(), statN: 7, foodQ: '', foodSeg: 'mine' };

function applyTheme() {

}

/* ================= екран „Дан“ ================= */
function ring(frac, color, over) {
  const r = 52, c = 2 * Math.PI * r, f = Math.max(0, Math.min(1, frac));
  return `<svg viewBox="0 0 120 120" aria-hidden="true"><circle cx="60" cy="60" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="11"/>
    <circle cx="60" cy="60" r="${r}" fill="none" stroke="${over ? 'var(--warn)' : color}" stroke-width="11" stroke-linecap="round"
    stroke-dasharray="${(c * f).toFixed(1)} ${c.toFixed(1)}" transform="rotate(-90 60 60)"/></svg>`;
}

function tipsFor(c) {
  const k = c.k, isToday = k === todayKey(), t = target(), [pmin, pmax] = protRange();
  const hour = new Date().getHours();
  const rem = t - c.kcal, prem = pmin - c.p;
  const out = [];
  const routines = routinesOn(k);
  const heavyPlanned = routines.some(r => r.met >= 5 && routineState(k, r) !== 'skip');
  const heavy = c.ak >= 300 || heavyPlanned;
  const short = (c.d.acts || []).some(a => a.short);
  if (!isToday) {
    if (!c.logged) return [['📝', 'За овај дан нема уноса хране. Можеш да га допуниш кад год хоћеш.']];
    const b = c.bal;
    out.push([b <= 0 ? '✅' : '💛', b <= 0
      ? `Тог дана си била у дефициту ${fmt(-b)} kcal, протеин ${fmt(c.p)} g.`
      : `Тог дана је био мали вишак од ${fmt(b)} kcal. Рачуна се недеља, не један дан.`]);
    if (c.p >= pmin) out.push(['💪', 'Протеин је био испуњен.']);
    return out;
  }
  if (!c.logged) {
    if (hour < 11) out.push(['☀️', 'Добро јутро! Доручак са протеинима (јаја, туњевина, јогурт, скир) држи ситост до ручка.']);
    else out.push(['🍽️', 'Још ниси унела ниједан оброк данас. Тапни „+ Оброк“ кад будеш јела.']);
  } else if (rem < -50) {
    const wb = weekBalance(k);
    out.push(['💛', `Данас си ${fmt(-rem)} kcal преко циља. Није страшно, рачуна се недеља, не један дан.` +
      (wb.sum < 0 ? ` Последњих 7 дана си и даље у дефициту ${fmt(-wb.sum)} kcal.` : ' Сутра само настави по плану.')]);
  } else if (rem <= 60 && c.p >= pmin) {
    out.push(['🎉', 'Одлично! Циљ калорија и протеина за данас је испуњен.']);
  } else if (prem > 5 && rem > 0) {
    const tight = rem < prem * 6;
    out.push(['💪', `Остало ти је ${fmt(rem)} kcal и још ~${fmt(prem)} g протеина.` +
      (tight ? ' Бирај нешто баш протеинско: протеински пудинг, скир, посни сир, беланца, туњевина.' : ' Добар избор: јаја, пилетина, туњевина, скир или протеински пудинг.')]);
  } else if (rem > 0) {
    out.push(['🍽️', `Остало ти је још ${fmt(rem)} kcal за данас.` + (c.p >= pmin ? ' Протеин је већ испуњен 👏' : '')]);
  }
  if (heavy && rem > -150) out.push(['💃', 'Данас трошиш више због тренинга/плеса. Слободно додај 150–200 kcal, најбоље протеин пре или после.']);
  if (short) out.push(['👏', 'Скраћен тренинг је и даље тренинг. Доследност је важнија од савршенства.']);
  if (isToday && hour >= 20 && c.logged && c.kcal < 1200) out.push(['⚠️', `До сада само ${fmt(c.kcal)} kcal. Превелики дефицит умара и топи мишиће. Поједи још нешто лагано и протеинско.`]);
  const glasses = S.profile.glass || 250, wgoal = S.profile.water || 2250;
  if (hour >= 15 && c.water < wgoal / 2) out.push(['💧', `Попила си ${fmt(c.water / 1000, 1)} L од ${fmt(wgoal / 1000, 2)} L. Чаша воде сада?`]);
  if (hour >= 17 && c.steps && c.steps < 7000) {
    const more = 8000 - c.steps;
    out.push(['🚶‍♀️', `Још ${fmt(more)} корака ≈ ${fmt(stepsKcal(more, c.w))} kcal. Кратка шетња после вечере?`]);
  }
  return out.slice(0, 3);
}

function renderToday() {
  const k = ui.date, t0 = todayKey(), isToday = k === t0;
  const c = calc(k), t = target(), [pmin, pmax] = protRange();
  // заглавље: датум и недеља
  const monday = addDays(k, -wd(k));
  const week = lastDays(addDays(monday, 6), 7).map(dk => {
    const cc = calc(dk), fut = dk > t0;
    const dot = cc.logged ? (inTarget(cc) ? 'ok' : 'over') : '';
    return `<button class="wd ${dk === k ? 'sel' : ''}" data-date="${dk}" ${fut ? 'disabled' : ''}>${DAY_SHORT[wd(dk)]}<b>${parseKey(dk).getDate()}</b><i class="${dot}"></i></button>`;
  }).join('');
  $('#topin').innerHTML = L(`<div class="topbar datenav">
      <button class="iconbtn" data-nav="-1" aria-label="Претходни дан">${ICON.left}</button>
      <button class="dt" data-nav="pick"><b>${dateLabel(k)}</b><span>${dateLong(k)}</span></button>
      <button class="iconbtn" data-nav="1" aria-label="Следећи дан" ${isToday ? 'disabled' : ''}>${ICON.right}</button>
    </div><div class="week">${week}</div>`);

  let h = '';
  // подсетник за бекап
  const hasData = Object.keys(S.days).length > 0;
  const since = S.settings.lastBackup ? Math.floor((Date.now() - S.settings.lastBackup) / 864e5) : null;
  if (hasData && isToday && (since === null || since >= 7)) {
    h += `<div class="banner"><span>💾</span><div class="grow">${since === null ? 'Још ниси направила бекап.' : `Последњи бекап пре ${since} дана.`}</div><button class="btn sm" data-act="backup">Сачувај</button></div>`;
  }

  // кругови
  const rem = t - c.kcal, over = rem < 0;
  h += `<div class="card"><div class="hero">
    <div><div class="ringbox">${ring(c.kcal / t, 'var(--accent)', over)}
      <div class="rc"><b class="num">${fmt(c.kcal)}</b><span>од ${fmt(t)} kcal</span>
      <em class="${over ? 'warn' : ''}">${over ? '+' + fmt(-rem) + ' преко' : 'још ' + fmt(rem)}</em></div></div>
      <div class="ringlabel">Калорије</div></div>
    <div><div class="ringbox">${ring(c.p / pmin, 'var(--prot)', false)}
      <div class="rc"><b class="num">${fmt(c.p)} g</b><span>циљ ${pmin}–${pmax} g</span>
      <em class="${c.p >= pmin ? 'pos' : 'prot'}">${c.p >= pmin ? 'испуњено ✓' : 'још ' + fmt(pmin - c.p) + ' g'}</em></div></div>
      <div class="ringlabel">Протеин</div></div>
  </div></div>`;

  // биланс
  const wb = weekBalance(k);
  const bal = c.bal;
  h += `<div class="card">
    <div class="balance"><div>
      <div class="muted small">${c.logged ? (bal <= 0 ? 'Дефицит' : 'Суфицит') : 'Биланс'}${isToday && c.logged ? ' (ако више не једеш)' : ''}</div>
      <div class="bigval num ${c.logged ? (bal <= 0 ? 'pos' : 'warn') : 'faint'}">${c.logged ? signed(Math.round(bal)) + ' kcal' : '—'}</div>
    </div>
    <div style="text-align:right"><div class="muted small">Потрошња</div><div class="num" style="font-size:20px;font-weight:750">≈ ${fmt(c.exp)} kcal</div></div></div>
    <div class="breakdown">
      <span class="pill">основно ${fmt(c.rest)}</span>
      <span class="pill">кораци ${fmt(c.st)}</span>
      <span class="pill">вежбе ${fmt(c.ak)}</span>
    </div>
    ${wb.n ? `<div class="weekline">Последњих 7 дана: <b class="${wb.sum <= 0 ? 'pos' : 'warn'} num">${signed(Math.round(wb.sum))} kcal</b>
      <span class="muted">${wb.sum < 0 ? ' ≈ ' + fatText(-wb.sum) + ' масти мање' : ''} · ${wb.n}/7 дана унето</span></div>` : ''}
  </div>`;

  // поруке
  for (const [em, txt] of tipsFor(c)) h += `<div class="tip"><div class="em">${em}</div><p>${txt}</p></div>`;

  // рутине
  for (const r of routinesOn(k)) {
    const st = routineState(k, r);
    if (st === 'done') continue;
    if (st === 'skip') {
      h += `<div class="row"><div class="grow"><b class="faint">${esc(r.name)}</b><span>прескочено</span></div><button class="btn sm ghost" data-unskip="${r.id}">Врати</button></div>`;
      continue;
    }
    h += `<div class="routine"><div class="rt"><div><b>${esc(r.name)}</b><div class="muted small">${r.min} мин · ≈ ${fmt(actKcal(r.met, r.min, c.w))} kcal</div></div><span class="pill">план</span></div>
      <div class="btnrow"><button class="btn pos sm" data-rdone="${r.id}">✓ Урадила</button><button class="btn sm" data-rshort="${r.id}">Скраћено</button><button class="btn sm ghost" data-rskip="${r.id}">Прескочи</button></div></div>`;
  }

  // плочице: кораци и вода
  const wgoal = S.profile.water || 2250;
  h += `<div class="tiles">
    <button class="tile" data-act="steps"><span class="tl">👟 Кораци</span><span class="tv num">${c.d.steps ? fmt(c.d.steps) : '—'}</span>
      <span class="ts">${c.d.steps ? '≈ ' + fmt(c.st) + ' kcal' : 'тапни да упишеш'}</span></button>
    <div class="tile"><span class="tl">💧 Вода</span><span class="tv num">${fmt(c.water / 1000, 2)} L</span>
      <div class="bar"><i style="width:${Math.min(100, c.water / wgoal * 100)}%;background:var(--water)"></i></div>
      <div class="water-ctrl"><button data-water="-1" aria-label="Мање">−</button><span class="ts" style="flex:1;text-align:center">${S.profile.glass || 250} ml</span><button data-water="1" aria-label="Више">+</button></div></div>
  </div>`;

  // оброци
  const meals = [...(c.d.meals || [])].sort((a, b) => (a.time || '').localeCompare(b.time || ''));
  h += `<div class="sec"><h2>Оброци</h2><span class="muted small num">${fmt(c.kcal)} kcal · ${fmt(c.p)} g протеина</span></div>`;
  if (!meals.length) h += `<div class="empty">Нема унетих оброка.<br>Тапни „+ Оброк“ доле десно.</div>`;
  for (const m of meals) {
    const mk = m.items.reduce((s, i) => s + i.kcal, 0), mp = m.items.reduce((s, i) => s + i.p, 0);
    h += `<div class="meal"><button class="meal-h" data-meal="${m.id}"><div><b>${esc(m.slot)}</b> <span class="mt">${esc(m.time || '')}</span></div>
      <span class="num small"><b>${fmt(mk)}</b> kcal · <span class="prot">${fmt(mp)} g</span></span></button>
      <ul>${m.items.map(i => `<li><span>${esc(i.name)} <span class="faint">${esc(itemLine(i))}</span></span><span class="num">${fmt(i.kcal)}</span></li>`).join('')}</ul>
      ${!isToday ? `<div class="meal-actions"><button data-copymeal="${m.id}">Понови данас</button></div>` : ''}</div>`;
  }

  // активности
  h += `<div class="sec"><h2>Активности</h2><button class="linkbtn" data-act="addact">+ Додај</button></div>`;
  const acts = c.d.acts || [];
  if (!acts.length && !c.d.steps) h += `<div class="empty">Нема унетих активности.</div>`;
  for (const a of acts) {
    h += `<button class="row" data-editact="${a.id}"><div class="grow"><b>${esc(a.name)}${a.short ? '<span class="badge">скраћено</span>' : ''}</b><span>${a.min} мин${a.int && a.int !== 1 ? (a.int < 1 ? ' · лагано' : ' · јако') : ''}</span></div>
      <div class="end num">${fmt(a.kcal)} kcal</div></button>`;
  }

  // дан: расположење, тежина, белешка
  h += `<div class="sec"><h2>Како је било</h2></div><div class="card">
    <div class="moods">${MOODS.map((m, i) => `<button data-mood="${i + 1}" class="${c.d.mood === i + 1 ? 'on' : ''}" aria-label="Расположење ${i + 1}">${m}</button>`).join('')}</div>
    <label class="f">Белешка за дан</label>
    <textarea id="daynote" placeholder="нпр. уморна после посла, одлична енергија на плесу…">${esc(c.d.note || '')}</textarea>
    <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px">
      <span class="muted small">⚖️ Тежина (није обавезно)</span>
      <button class="btn sm" data-act="weight">${c.d.weight ? fmt(c.d.weight, 1) + ' kg' : 'Упиши'}</button>
    </div></div>`;

  $('#view').innerHTML = L(h);
}
function fatText(kcal) { const g = kcal / 7.7; return g >= 1000 ? fmt(g / 1000, 1) + ' kg' : fmt(Math.round(g / 10) * 10) + ' g'; }

$('#top').addEventListener('click', e => {

  if (n) {
    if (n.dataset.nav === 'pick') return datePick();

    if (nk <= todayKey()) { ui.date = nk; render(); }
    return;
  }

function datePick() {
  const sh = openSheet('Изабери дан', `<input type="date" id="dp" value="${ui.date}" max="${todayKey()}"><div style="height:10px"></div>
    <button class="btn block" id="dpt">Данас</button>`, `<button class="btn primary" id="dpo">Иди</button>`);

$('#view').addEventListener('click', e => {
  if (ui.tab !== 'today') return;
  const t = e.target.closest('button'); if (!t) return;
  const ds = t.dataset, k = ui.date;
  if (ds.meal) return mealSheet(k, ds.meal);
  if (ds.copymeal) {
    const m = peek(k).meals.find(x => x.id === ds.copymeal);
    day(todayKey()).meals.push({ ...JSON.parse(JSON.stringify(m)), id: uid(), time: nowTime() });
    save(); toast('Оброк је додат у данашњи дан'); return;
  }
  if (ds.rdone) { const r = S.routines.find(x => x.id === ds.rdone); addRoutineAct(k, r, r.min, false); return; }
  if (ds.rshort) { const r = S.routines.find(x => x.id === ds.rshort); return actSheet(k, null, r); }
  if (ds.rskip) { const d = day(k); d.skip.push(ds.rskip); save(); render(); return; }
  if (ds.unskip) { const d = day(k); d.skip = d.skip.filter(x => x !== ds.unskip); save(); render(); return; }
  if (ds.water) {
    const d = day(k); d.water = Math.max(0, (d.water || 0) + (+ds.water) * (S.profile.glass || 250));
    save(); render(); return;
  }
  if (ds.editact) return actSheet(k, ds.editact);
  if (ds.mood) { const d = day(k); d.mood = d.mood === +ds.mood ? null : +ds.mood; save(); render(); return; }
  switch (ds.act) {
    case 'steps': return stepsSheet(k);
    case 'addact': return actSheet(k);
    case 'weight': return weightSheet(k);
    case 'backup': return exportBackup();
  }
});
$('#view').addEventListener('change', e => {

});

function addRoutineAct(k, r, min, short) {
  const w = weightOn(k);
  day(k).acts.push({ id: uid(), rid: r.id, name: r.name, met: r.met, min, int: 1, short, kcal: Math.round(actKcal(r.met, min, w)) });
  save(); render();
  if (!short) toast('Браво! 💪');
}

/* ================= листови (sheets) ================= */
const stack = [];
let ignorePop = 0;
function openSheet(title, body, foot = '', opts = {}) {
  const bd = document.createElement('div');
  bd.className = 'backdrop';
  bd.innerHTML = L(`<div class="sheet" role="dialog" aria-modal="true">
    <div class="sheet-h"><h3>${title}</h3><button class="iconbtn" data-close aria-label="Затвори">${ICON.close}</button></div>
    <div class="sheet-b">${body}</div>${foot ? `<div class="sheet-f">${foot}</div>` : ''}</div>`);
  bd.addEventListener('click', e => { if (e.target === bd || e.target.closest('[data-close]')) closeSheet(); });
  document.body.appendChild(bd);
  document.body.style.overflow = 'hidden';
  bd.onClose = opts.onClose;
  stack.push(bd);
  if (stack.length === 1) history.pushState({ sheet: 1 }, '');
  return bd;
}
function removeTop() {
  const bd = stack.pop(); if (!bd) return;
  bd.remove();
  if (bd.onClose) bd.onClose();
  if (!stack.length) document.body.style.overflow = '';
}
function closeSheet(n = 1) {
  for (let i = 0; i < n && stack.length; i++) removeTop();
  if (!stack.length) { ignorePop++; history.back(); }
}
window.addEventListener('popstate', () => {
  if (ignorePop) { ignorePop--; return; }
  if (!stack.length) return;
  removeTop();
  if (stack.length) history.pushState({ sheet: 1 }, '');
});
function ask(text, okLabel, cb, danger = true) {
  const sh = openSheet('Потврда', `<p>${text}</p>`, `<button class="btn" data-close>Одустани</button><button class="btn ${danger ? 'warn' : 'primary'}" id="okb">${okLabel}</button>`);
  $('#okb', sh).onclick = () => { closeSheet(); cb(); };
}

/* ---------- оброк ---------- */
function defaultSlot() {
  const h = new Date().getHours();
  return h < 10 ? 'Доручак' : h < 12 ? 'Ужина' : h < 15 ? 'Ручак' : h < 19 ? 'Ужина' : 'Вечера';
}
function mealSheet(k, mealId) {
  const d = peek(k);
  const existing = mealId && d ? d.meals.find(m => m.id === mealId) : null;
  const draft = existing ? JSON.parse(JSON.stringify(existing))
    : { id: uid(), slot: defaultSlot(), time: k === todayKey() ? nowTime() : '12:00', items: [] };
  const sh = openSheet(existing ? 'Измени оброк' : 'Нови оброк', `
    <div class="chips" id="slots"></div>
    <label class="f">Време</label><input type="time" id="mtime" value="${draft.time}">
    <div id="mitems"></div>
    <button class="btn block" id="madd" style="margin-top:8px">${ICON.plus.replace('<svg', '<svg width="18" height="18"')} Додај намирницу</button>
    <div class="grid2" style="margin-top:8px">
      <button class="btn sm ghost" id="mrec">Сачувај као рецепт</button>
      ${existing ? '<button class="btn sm danger" id="mdel">Обриши оброк</button>' : '<span></span>'}
    </div>`,
    `<button class="btn" data-close>Откажи</button><button class="btn primary" id="msave">Сачувај</button>`);
  const draw = () => {
    $('#slots', sh).innerHTML = L(SLOTS.map(s => `<button class="chip ${s === draft.slot ? 'on' : ''}" data-slot="${esc(s)}">${esc(s)}</button>`).join(''));
    const tk = draft.items.reduce((s, i) => s + i.kcal, 0), tp = draft.items.reduce((s, i) => s + i.p, 0);
    $('#mitems', sh).innerHTML = L((draft.items.length ? draft.items.map((it, i) => `<div class="item"><button class="grow" style="text-align:left" data-edit="${i}"><b>${esc(it.name)}</b>
      <span class="num">${esc(itemLine(it))} · ${fmt(it.kcal)} kcal · ${fmt(it.p, 1)} g П</span></button><button class="x" data-rm="${i}" aria-label="Уклони">×</button></div>`).join('')
      : '<div class="empty">Још нема намирница у оброку.</div>') +
      (draft.items.length ? `<div class="sumline"><span>Укупно</span><span class="num">${fmt(tk)} kcal · <span class="prot">${fmt(tp, 1)} g протеина</span></span></div>` : ''));
  };
  draw();
  sh.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.slot) { draft.slot = b.dataset.slot; draw(); }
    else if (b.dataset.rm) { draft.items.splice(+b.dataset.rm, 1); draw(); }
    else if (b.dataset.edit) {
      const i = +b.dataset.edit, it = draft.items[i], f = it.fid && getFood(it.fid);
      if (f) qtySheet(f, items => { draft.items.splice(i, 1, ...items); draw(); }, it.g);
      else quickSheet(it, nit => { draft.items[i] = nit; draw(); });
    }
  });
  $('#mtime', sh).onchange = e => { draft.time = e.target.value; };
  $('#madd', sh).onclick = () => pickFood({ meals: true }, items => { draft.items.push(...items); draw(); });
  $('#mrec', sh).onclick = () => {
    if (draft.items.length < 1) return toast('Прво додај намирнице');
    recipeSheet(null, draft.items.map(i => ({ ...i })));
  };
  if (existing) $('#mdel', sh).onclick = () => ask('Обрисати овај оброк?', 'Обриши', () => {
    const dd = day(k); dd.meals = dd.meals.filter(m => m.id !== draft.id); save(); closeSheet(); render();
  });
  $('#msave', sh).onclick = () => {
    const dd = day(k);
    if (!draft.items.length) {
      if (existing) dd.meals = dd.meals.filter(m => m.id !== draft.id);
      save(); closeSheet(); render(); return;
    }
    const i = dd.meals.findIndex(m => m.id === draft.id);
    if (i >= 0) dd.meals[i] = draft; else dd.meals.push(draft);
    noteUse(draft.items);
    save(); closeSheet(); render();
    toast('Оброк је сачуван');
  };
  if (!existing) pickFood({ meals: true }, items => { draft.items.push(...items); draw(); });
}

/* ---------- бирање намирнице ---------- */
function recentMeals() {
  const out = [], seen = new Set();
  const keys = Object.keys(S.days).sort().reverse().slice(0, 30);
  for (const k of keys) for (const m of [...S.days[k].meals || []].reverse()) {
    const sig = m.items.map(i => i.name).join('|');
    if (!m.items.length || seen.has(sig)) continue;
    seen.add(sig); out.push({ k, m });
    if (out.length >= 8) return out;
  }
  return out;
}
function foodRes(f) {
  const tag = f.src === 'recipe' ? '<span class="badge">рецепт</span>' : f.src === 'off' ? '<span class="badge">нет</span>' : f.src === 'user' ? '<span class="badge">моје</span>' : '';
  const por = f.portion ? ` · ${esc(f.portion[0])} ${fmt(f.portion[1])} ${unitOf(f)}` : '';
  return `<button class="res" data-fid="${esc(f.id)}"><div class="grow"><b>${esc(f.name)}${tag}</b><span>${f.brand ? esc(f.brand) + ' · ' : ''}${fmt(f.kcal)} kcal · ${fmt(f.p, 1)} g П на 100 ${unitOf(f)}${por}</span></div></button>`;
}
function pickFood(opts, cb) {
  const sh = openSheet('Додај намирницу', `
    <input type="search" id="pq" placeholder="Тражи: јаје, туњевина, хлеб…" autocomplete="off">
    <div class="actions3">
      <button class="btn" id="pscan"><span>📷</span>Бар-код</button>
      <button class="btn" id="pnet"><span>🌐</span>Интернет</button>
      <button class="btn" id="pman"><span>✍️</span>Ручно</button>
    </div>
    <div id="pres"></div>`);
  const input = $('#pq', sh), res = $('#pres', sh);
  const done = items => { closeSheet(); cb(items); };
  const draw = () => {
    const q = input.value.trim();
    let h = '';
    if (!q) {
      if (opts.meals) {
        const rm = recentMeals();
        if (rm.length) h += `<div class="gh">Понови оброк</div>` + rm.map(({ m }, i) => {
          const tk = m.items.reduce((s, x) => s + x.kcal, 0);
          return `<button class="res" data-rmeal="${i}"><div class="grow"><b>${esc(m.slot)}</b><span>${esc(m.items.map(x => x.name).join(', '))}</span></div><div class="end num">${fmt(tk)} kcal</div></button>`;
        }).join('');
        draw.rm = rm;
      }
      const rec = S.recent.map(getFood).filter(Boolean).slice(0, 20);
      if (rec.length) h += `<div class="gh">Скорашње</div>` + rec.map(foodRes).join('');
      if (!h) h = `<div class="empty">Почни да куцаш назив. У бази има ${BASE.length} намирница и јела,<br>а оно што често једеш појавиће се овде.</div>`;
    } else {
      const r = searchFoods(q);
      h = r.length ? r.map(foodRes).join('') : `<div class="empty">Нема „${esc(q)}“ у бази.<br>Пробај 🌐 Интернет или ✍️ Ручно.</div>`;
    }
    res.innerHTML = L(h);
  };
  input.addEventListener('input', draw);
  draw();
  res.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.rmeal) {
      const m = draw.rm[+b.dataset.rmeal].m;
      return done(JSON.parse(JSON.stringify(m.items)));
    }
    const f = getFood(b.dataset.fid);
    if (f) qtySheet(f, items => done(items));
  });
  $('#pscan', sh).onclick = () => barcodeSheet(f => qtySheet(f, items => done(items)));
  $('#pnet', sh).onclick = () => netSheet(input.value.trim(), f => qtySheet(f, items => done(items)));
  $('#pman', sh).onclick = () => manualSheet(input.value.trim(), r => {
    if (r.item) done([r.item]); else qtySheet(r.food, items => done(items));
  });
}

/* ---------- количина ---------- */
function qtySheet(f, cb, g0) {
  const u = unitOf(f);
  const por = f.portion && f.portion[1] > 0 ? f.portion : null;
  // Подразумевано у грамима (тако она уноси); порција је брзи избор.
  let mode = 'g';
  let val = g0 != null ? g0 : por ? por[1] : 100;
  const sh = openSheet(esc(f.name), `
    <div class="muted small" style="text-align:center">${fmt(f.kcal)} kcal · ${fmt(f.p, 1)} g протеина на 100 ${u}${f.brand ? ' · ' + esc(f.brand) : ''}</div>
    ${por ? `<div class="chips" style="justify-content:center;margin-top:12px"><button class="chip" data-mode="p">${esc(por[0])} (${fmt(por[1])} ${u})</button><button class="chip" data-mode="g">${u}</button></div>` : ''}
    <label class="f" id="qlab"></label>
    <input type="text" inputmode="decimal" id="qv" autocomplete="off">
    <div class="chips" id="qq" style="margin-top:8px"></div>
    <div class="qty-big"><b class="num" id="qk"></b><span class="muted">kcal</span><b class="num prot" id="qp" style="font-size:22px;margin-left:10px"></b><span class="muted">g протеина</span></div>
    <div class="muted small" style="text-align:center" id="qg"></div>
    ${f.src === 'recipe' ? '<button class="btn block sm ghost" id="qsplit" style="margin-top:10px">Додај као састојке (да измениш појединачно)</button>' : ''}`,
    `<button class="btn" data-close>Назад</button><button class="btn primary" id="qok">${g0 != null ? 'Сачувај' : 'Додај'}</button>`);
  const input = $('#qv', sh);
  const grams = () => { const v = num(input.value); return isFinite(v) ? (mode === 'p' ? v * por[1] : v) : NaN; };
  const draw = () => {
    $$('[data-mode]', sh).forEach(b => b.classList.toggle('on', b.dataset.mode === mode));
    $('#qlab', sh).textContent = L(mode === 'p' ? 'Колико (' + por[0] + ')' : 'Количина (' + u + ')');
    const quick = mode === 'p' ? [0.5, 1, 1.5, 2, 3] : [30, 50, 100, 150, 200, 250];
    $('#qq', sh).innerHTML = quick.map(q => `<button class="chip" data-q="${q}">${fmt(q, 1)}</button>`).join('');
    upd();
  };
  const upd = () => {
    const g = grams();
    $('#qk', sh).textContent = isFinite(g) ? fmt(f.kcal * g / 100) : '—';
    $('#qp', sh).textContent = isFinite(g) ? fmt(f.p * g / 100, 1) : '—';
    $('#qg', sh).textContent = isFinite(g) && mode === 'p' ? '= ' + fmt(g) + ' ' + u : '';
  };
  input.value = String(Math.round(val * 100) / 100).replace('.', ',');
  draw();
  input.addEventListener('input', upd);
  sh.addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    if (b.dataset.mode && b.dataset.mode !== mode) {
      const g = grams();
      mode = b.dataset.mode;
      if (isFinite(g)) input.value = String(Math.round((mode === 'p' ? g / por[1] : g) * 100) / 100).replace('.', ',');
      draw();
    } else if (b.dataset.q) { input.value = b.dataset.q.replace('.', ','); upd(); }
  });
  setTimeout(() => { input.focus(); input.select(); }, 250);
  $('#qok', sh).onclick = () => {
    const g = grams();
    if (!(g > 0)) return toast('Упиши количину');
    closeSheet(); cb([makeItem(f, g)]);
  };
  const split = $('#qsplit', sh);
  if (split) split.onclick = () => {
    const g = grams(); if (!(g > 0)) return toast('Упиши количину');
    const k = g / (f.totalG || 1);
    const items = (f.items || []).map(it => ({ ...it, g: Math.round(it.g * k * 10) / 10, kcal: Math.round(it.kcal * k * 10) / 10, p: Math.round(it.p * k * 10) / 10 }));
    closeSheet(); cb(items);
  };
}

function manualSheet(q, cb, pre = {}) {

/* ---------- бар-код и интернет (Open Food Facts) ---------- */
const OFF = 'https://world.openfoodfacts.org';
function offFood(p, code) {
  const n = p.nutriments || {};
  let kcal = n['energy-kcal_100g'];
  if (kcal == null && n['energy_100g'] != null) kcal = n['energy_100g'] / 4.184;
  if (kcal == null) return null;
  const name = (p.product_name_sr || p.product_name || p.generic_name || '').trim();
  if (!name) return null;
  const sq = parseFloat(p.serving_quantity);
  return {
    id: 'o:' + (code || p.code || uid()), name, brand: (p.brands || '').split(',')[0].trim(), kcal: Math.round(kcal * 10) / 10,
    p: Math.round((n['proteins_100g'] || 0) * 10) / 10, unit: /ml|l\b/i.test(p.quantity || '') && !/g\b/i.test(p.quantity || '') ? 'ml' : 'g',
    portion: sq > 0 ? ['порција', sq] : null, barcode: code || p.code, src: 'off'
  };
}
async function fetchJSON(url, ms = 12000) {
  const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), ms);
  try { const r = await fetch(url, { signal: ctl.signal }); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
function barcodeSheet(cb) {
  const native = !!(window.FitAndroid && window.FitAndroid.scanBarcode);
  const web = 'BarcodeDetector' in window && navigator.mediaDevices;
  const sh = openSheet('Бар-код', `
    ${native || web ? '<button class="btn primary block" id="bscan">📷 Скенирај камером</button><div id="bcam"></div>' : ''}
    <label class="f">${native || web ? 'или упиши број испод бар-кода' : 'Упиши број испод бар-кода'}</label>
    <input type="text" inputmode="numeric" id="bc" placeholder="нпр. 3838…">
    <button class="btn block" id="bgo" style="margin-top:10px">Тражи</button>
    <div id="bst" class="note hidden"></div>`, '', { onClose: () => stopCam() });
  let stream = null, timer = null;
  const stopCam = () => { clearInterval(timer); if (stream) stream.getTracks().forEach(t => t.stop()); stream = null; };
  const status = t => { const s = $('#bst', sh); s.classList.remove('hidden'); s.innerHTML = L(t); };
  const lookup = async code => {
    code = String(code || '').replace(/\D/g, '');
    if (code.length < 6) return toast('Бар-код није исправан');
    stopCam();
    $('#bc', sh).value = code;
    const local = Object.values(S.foods).find(f => f.barcode === code);
    if (local) { closeSheet(); cb(local); return; }
    status('Тражим производ…');
    try {
      const j = await fetchJSON(`${OFF}/api/v2/product/${code}.json?fields=code,product_name,product_name_sr,generic_name,brands,quantity,serving_quantity,nutriments`);
      const f = j && j.status === 1 && j.product ? offFood(j.product, code) : null;
      if (f) { S.foods[f.id] = f; save(); closeSheet(); cb(f); return; }
      closeSheet();
      manualSheet('', r => r.food ? cb(r.food) : null, { barcode: code, msg: 'Производ није пронађен у отвореној бази. Упиши вредности са етикете. Следећи пут ће бити препознат одмах.' });
    } catch (e) {
      status('Нема интернета или сервер не одговара. Покушај поново или унеси ручно са етикете.');
    }
  };
  $('#bgo', sh).onclick = () => lookup($('#bc', sh).value);
  const scanBtn = $('#bscan', sh);
  if (scanBtn) scanBtn.onclick = async () => {
    if (native) {
      window.onBarcode = code => { window.onBarcode = null; if (code) lookup(code); };
      window.FitAndroid.scanBarcode();
      return;
    }
    try {
      const det = new BarcodeDetector({ formats: ['ean_13', 'ean_8', 'upc_a', 'upc_e'] });
      stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
      const v = document.createElement('video'); v.className = 'scan'; v.playsInline = true; v.muted = true; v.srcObject = stream;
      $('#bcam', sh).replaceChildren(v); await v.play();
      timer = setInterval(async () => {
        try { const r = await det.detect(v); if (r[0]) lookup(r[0].rawValue); } catch (e) { }
      }, 350);
    } catch (e) { toast('Камера није доступна'); }
  };
}
function netSheet(q, cb) {
  const sh = openSheet('Тражи на интернету', `
    <div style="display:flex;gap:8px"><input type="search" id="nq" value="${esc(q)}" placeholder="нпр. Tine protein puding"><button class="btn primary" id="ngo">Тражи</button></div>
    <div class="note">Претрага у бесплатној отвореној бази производа (Open Food Facts). Пре уноса провери вредности са етикетом, јер базу пуне људи.</div>
    <div id="nres"></div>`);
  const res = $('#nres', sh);
  let found = [];
  const go = async () => {
    const term = $('#nq', sh).value.trim(); if (!term) return;
    res.innerHTML = L('<div class="empty">Тражим…</div>');
    const fields = 'code,product_name,product_name_sr,generic_name,brands,quantity,serving_quantity,nutriments';
    try {
      let prods;
      try {
        const j = await fetchJSON(`${OFF}/cgi/search.pl?search_terms=${encodeURIComponent(term)}&search_simple=1&action=process&json=1&page_size=30&fields=${fields}`);
        prods = j.products || [];
      } catch (e) {
        const j = await fetchJSON(`https://search.openfoodfacts.org/search?q=${encodeURIComponent(term)}&page_size=30&fields=${fields}`);
        prods = j.hits || [];
      }
      found = prods.map(p => offFood(p, p.code)).filter(Boolean);
      res.innerHTML = L(found.length ? found.map((f, i) => `<button class="res" data-i="${i}"><div class="grow"><b>${esc(f.name)}</b><span>${f.brand ? esc(f.brand) + ' · ' : ''}${fmt(f.kcal)} kcal · ${fmt(f.p, 1)} g П на 100 ${f.unit}</span></div></button>`).join('')
        : '<div class="empty">Ништа није пронађено. Пробај другачији назив (латиницом, бренд) или ✍️ Ручно.</div>');
    } catch (e) {
      res.innerHTML = L('<div class="empty">Нема интернета или сервер не одговара. Покушај поново мало касније.</div>');
    }
  };
  $('#ngo', sh).onclick = go;
  $('#nq', sh).addEventListener('keydown', e => { if (e.key === 'Enter') go(); });
  res.addEventListener('click', e => {
    const b = e.target.closest('[data-i]'); if (!b) return;
    const f = found[+b.dataset.i];
    S.foods[f.id] = f; save();
    closeSheet(); cb(f);
  });
  if (q) go();
}

    $('#ri', sh).innerHTML = L((r.items.length ? r.items.map((it, i) => `<div class="item"><div class="grow"><b>${esc(it.name)}</b><span class="num">${esc(itemLine(it))} · ${fmt(it.kcal)} kcal · ${fmt(it.p, 1)} g П</span></div><button class="x" data-rm="${i}">×</button></div>`).join('')
      : '<div class="empty">Додај састојке у грамима.</div>') +
      (r.items.length ? `<div class="sumline"><span>Цело јело</span><span class="num">${fmt(tk)} kcal · <span class="prot">${fmt(tp, 1)} g</span></span></div>` : ''));

  $('#radd', sh).onclick = () => pickFood({ meals: false }, items => { r.items.push(...items); draw(); });
  if (ex) $('#rdel', sh).onclick = () => ask('Обрисати рецепт „' + esc(r.name) + '“? Већ унети оброци остају.', 'Обриши', () => { delete S.foods[r.id]; save(); closeSheet(); render(); });
  $('#rok', sh).onclick = () => {
    r.name = $('#rn', sh).value.trim();
    if (!r.name) return toast('Упиши назив рецепта');

    const rawG = r.items.reduce((s, i) => s + (i.g || 0), 0);
    const tk = r.items.reduce((s, i) => s + i.kcal, 0), tp = r.items.reduce((s, i) => s + i.p, 0);

/* ================= Статистика ================= */
function barChart(data, o) {
  const W = 340, H = 150, pl = 2, pr = 2, pt = 14, pb = 18;
  const n = data.length, iw = W - pl - pr, ih = H - pt - pb;
  const vals = data.map(d => d.v).filter(v => v != null && isFinite(v));
  let max = Math.max(1, ...vals.map(Math.abs), o.target || 0, o.band ? o.band[1] : 0) * 1.12;
  const bw = iw / n, gap = n > 45 ? 1 : 2, w = Math.max(1, bw - gap), rx = Math.min(4, w / 2);
  const zero = o.div ? pt + ih / 2 : pt + ih, sc = o.div ? (ih / 2) / max : ih / max;
  let s = '';
  if (o.band) s += `<rect x="${pl}" y="${zero - o.band[1] * sc}" width="${iw}" height="${(o.band[1] - o.band[0]) * sc}" fill="var(--prot-soft)"/>`;
  data.forEach((d, i) => {
    const x = pl + i * bw;
    s += `<rect class="col" x="${x}" y="${pt}" width="${bw}" height="${ih}" data-i="${i}"/>`;
    if (d.v == null || !isFinite(d.v) || d.v === 0) return;
    const hgt = Math.max(2, Math.abs(d.v) * sc);
    const y = o.div ? (d.v < 0 ? zero - hgt : zero) : zero - hgt;
    const col = o.color(d);
    s += `<rect x="${x + gap / 2}" y="${y}" width="${w}" height="${hgt}" rx="${rx}" fill="${col}" pointer-events="none"/>`;
  });
  s += `<line x1="${pl}" x2="${W - pr}" y1="${zero}" y2="${zero}" stroke="var(--line)" stroke-width="1"/>`;
  if (o.target) {
    const y = zero - o.target * sc;
    s += `<line x1="${pl}" x2="${W - pr}" y1="${y}" y2="${y}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="4 4" pointer-events="none"/>
      <text x="${W - pr}" y="${y - 4}" text-anchor="end">${esc(o.targetLabel || '')}</text>`;
  }
  if (o.div) {
    s += `<text x="${pl + 2}" y="${pt - 3}">${esc(o.upLabel || '')}</text><text x="${pl + 2}" y="${H - pb + 12}">${esc(o.downLabel || '')}</text>`;
  } else {
    const idx = n <= 7 ? data.map((_, i) => i) : [0, Math.floor((n - 1) / 2), n - 1];
    for (const i of idx) {
      const x = pl + i * bw + bw / 2;
      s += `<text x="${x}" y="${H - 4}" text-anchor="${i === 0 && n > 7 ? 'start' : i === n - 1 && n > 7 ? 'end' : 'middle'}">${esc(data[i].lab)}</text>`;
    }
  }
  const id = 'c' + uid();
  chartData[id] = data.map(d => d.tip);
  return `<div class="chart" data-chart="${id}"><div class="chart-tip">${esc(o.hint || 'Додирни стубић за детаље')}</div><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.aria || '')}">${s}</svg></div>`;
}
const chartData = {};
$('#view').addEventListener('click', e => {
  const r = e.target.closest('.chart .col'); if (!r) return;
  const ch = r.closest('.chart');
  $$('.col.on', ch).forEach(x => x.classList.remove('on'));
  r.classList.add('on');
  $('.chart-tip', ch).innerHTML = L(chartData[ch.dataset.chart][+r.dataset.i] || '');
});

function renderStats() {
  $('#topin').innerHTML = L(`<div class="topbar"><h1>Статистика</h1></div>`);
  const N = ui.statN, end = todayKey(), keys = lastDays(end, N);
  const cs = keys.map(calc), logged = cs.filter(c => c.logged);
  const t = target(), [pmin] = protRange();
  const sumBal = logged.reduce((s, c) => s + c.bal, 0);
  const avg = (arr, f) => arr.length ? arr.reduce((s, c) => s + f(c), 0) / arr.length : null;
  const stepsDays = cs.filter(c => c.steps > 0);
  // рутине
  let sched = 0, done = 0;
  for (const c of cs) for (const r of routinesOn(c.k)) {
    if (c.k === end && routineState(c.k, r) === 'pending') continue;
    if (!c.logged && !(c.d.acts || []).length) continue;
    sched++; if (routineState(c.k, r) === 'done') done++;
  }
  // низови
  const streak = pred => { let n = 0, k = end; if (!pred(calc(k))) k = addDays(k, -1); while (pred(calc(k))) { n++; k = addDays(k, -1); if (n > 3650) break; } return n; };
  const sLog = streak(c => c.logged), sTar = streak(inTarget), sProt = streak(c => c.logged && c.p >= pmin);

  let h = `<div class="chips" style="margin:4px 0 6px">${[[7, '7 дана'], [30, '30 дана'], [90, '90 дана']].map(([v, l]) => `<button class="chip ${N === v ? 'on' : ''}" data-n="${v}">${l}</button>`).join('')}</div>`;
  if (!logged.length) {
    h += `<div class="empty">За овај период још нема унете хране.<br>Статистика ће се попуњавати сама како уносиш дане.</div>`;
    $('#view').innerHTML = L(h); return;
  }
  h += `<div class="stat-tiles">
    <div class="st"><div class="l">Укупан биланс</div><div class="v num ${sumBal <= 0 ? 'pos' : 'warn'}">${signed(Math.round(sumBal))}</div><div class="s">kcal${sumBal < 0 ? ' ≈ ' + fatText(-sumBal) + ' масти' : ''}</div></div>
    <div class="st"><div class="l">Дана у циљу</div><div class="v num">${logged.filter(inTarget).length}/${logged.length}</div><div class="s">од унетих дана</div></div>
    <div class="st"><div class="l">Просечан унос</div><div class="v num">${fmt(avg(logged, c => c.kcal))}</div><div class="s">kcal · циљ ${fmt(t)}</div></div>
    <div class="st"><div class="l">Просечан протеин</div><div class="v num prot">${fmt(avg(logged, c => c.p))} g</div><div class="s">испуњен ${logged.filter(c => c.p >= pmin).length}/${logged.length} дана</div></div>
    <div class="st"><div class="l">Просечна потрошња</div><div class="v num">${fmt(avg(logged, c => c.exp))}</div><div class="s">kcal дневно</div></div>
    <div class="st"><div class="l">Кораци (просек)</div><div class="v num">${stepsDays.length ? fmt(avg(stepsDays, c => c.steps)) : '—'}</div><div class="s">${stepsDays.length} дана са уносом</div></div>
    <div class="st"><div class="l">Тренинг по плану</div><div class="v num">${sched ? Math.round(done / sched * 100) + '%' : '—'}</div><div class="s">${sched ? done + ' од ' + sched + ' планираних' : 'нема рутина'}</div></div>
    <div class="st"><div class="l">Минута вежбања</div><div class="v num">${fmt(cs.reduce((s, c) => s + c.amin, 0))}</div><div class="s">укупно у периоду</div></div>
  </div>
  <div class="card"><div class="card-head"><h2>🔥 Низови</h2></div>
    <div class="grid3" style="text-align:center">
      <div><div class="bigval num">${sLog}</div><div class="muted tiny">дана заредом са уносом</div></div>
      <div><div class="bigval num pos">${sTar}</div><div class="muted tiny">дана заредом у циљу</div></div>
      <div><div class="bigval num prot">${sProt}</div><div class="muted tiny">дана заредом протеин</div></div>
    </div></div>`;

  const lab = k => N <= 7 ? DAY_SHORT[wd(k)] : dateShort(k);
  const tipHead = c => `<b>${DAY_SHORT[wd(c.k)]} ${dateShort(c.k)}</b>: `;
  h += `<div class="card"><h2>Унос калорија</h2>${barChart(cs.map(c => ({ v: c.logged ? c.kcal : null, lab: lab(c.k), tip: tipHead(c) + (c.logged ? fmt(c.kcal) + ' kcal од ' + fmt(t) : 'нема уноса') })),
    { color: d => d.v > t + 50 ? 'var(--warn)' : 'var(--accent)', target: t, targetLabel: 'циљ ' + fmt(t), aria: 'Унос калорија по данима' })}</div>`;
  h += `<div class="card"><h2>Дефицит / суфицит</h2>${barChart(cs.map(c => ({ v: c.logged ? -c.bal : null, lab: lab(c.k), tip: tipHead(c) + (c.logged ? (c.bal <= 0 ? 'дефицит ' + fmt(-c.bal) : 'суфицит ' + fmt(c.bal)) + ' kcal (потрошња ' + fmt(c.exp) + ')' : 'нема уноса') })),
    { div: true, color: d => d.v >= 0 ? 'var(--pos)' : 'var(--warn)', upLabel: '↑ дефицит', downLabel: '↓ суфицит', aria: 'Дефицит и суфицит по данима' })}</div>`;
  h += `<div class="card"><h2>Протеин</h2>${barChart(cs.map(c => ({ v: c.logged ? c.p : null, lab: lab(c.k), tip: tipHead(c) + (c.logged ? fmt(c.p) + ' g' : 'нема уноса') })),
    { color: () => 'var(--prot)', band: protRange(), aria: 'Протеин по данима' })}<div class="muted tiny">Обојена трака је циљ ${protRange().join('–')} g.</div></div>`;
  if (stepsDays.length) h += `<div class="card"><h2>Кораци</h2>${barChart(cs.map(c => ({ v: c.steps || null, lab: lab(c.k), tip: tipHead(c) + (c.steps ? fmt(c.steps) + ' корака ≈ ' + fmt(c.st) + ' kcal' : 'нема уноса') })),
    { color: () => 'var(--water)', target: 8000, targetLabel: '8.000', aria: 'Кораци по данима' })}</div>`;
  const moods = cs.filter(c => c.d.mood);
  if (moods.length) h += `<div class="card"><h2>Расположење</h2><div class="muted small" style="margin-top:4px">Просек: ${MOODS[Math.round(avg(moods, c => c.d.mood)) - 1]} · унето ${moods.length} дана</div></div>`;
  if (S.settings.showWeight) {
    const ws = cs.filter(c => c.d.weight);
    if (ws.length) h += `<div class="card"><h2>Тежина</h2>${barChart(cs.map(c => ({ v: c.d.weight || null, lab: lab(c.k), tip: tipHead(c) + (c.d.weight ? fmt(c.d.weight, 1) + ' kg' : '—') })), { color: () => 'var(--muted)', aria: 'Тежина' })}</div>`;
  }
  // недеље
  if (N > 7) {
    const rows = [];
    for (let e = end; rows.length < Math.ceil(N / 7); e = addDays(e, -7)) {
      const ks = lastDays(e, 7), cc = ks.map(calc).filter(c => c.logged);
      rows.push(`<tr><td>${dateShort(ks[0])}–${dateShort(e)}</td><td class="r num">${cc.length}</td><td class="r num">${cc.length ? fmt(avg(cc, c => c.kcal)) : '—'}</td><td class="r num">${cc.length ? fmt(avg(cc, c => c.p)) : '—'}</td><td class="r num ${cc.reduce((s, c) => s + c.bal, 0) <= 0 ? 'pos' : 'warn'}">${cc.length ? signed(Math.round(cc.reduce((s, c) => s + c.bal, 0))) : '—'}</td></tr>`);
    }
    h += `<div class="card"><h2 style="margin-bottom:8px">По недељама</h2><table class="t"><tr><th>Недеља</th><th class="r">Дана</th><th class="r">kcal</th><th class="r">П g</th><th class="r">Биланс</th></tr>${rows.join('')}</table></div>`;
  }
  // најчешће
  const cnt = {};
  for (const c of cs) for (const m of c.d.meals || []) for (const it of m.items) { if (!it.fid) continue; cnt[it.name] = cnt[it.name] || { n: 0, k: 0 }; cnt[it.name].n++; cnt[it.name].k += it.kcal; }
  const top = Object.entries(cnt).sort((a, b) => b[1].n - a[1].n).slice(0, 8);
  if (top.length) h += `<div class="card"><h2 style="margin-bottom:8px">Најчешће једеш</h2><table class="t">${top.map(([n, v]) => `<tr><td>${esc(n)}</td><td class="r muted">${v.n}×</td><td class="r num">${fmt(v.k)} kcal</td></tr>`).join('')}</table></div>`;
  h += `<div class="note">Биланс = унос − потрошња. Минус значи дефицит (топи се), плус значи вишак. 7.700 kcal дефицита је отприлике 1 kg масти. Рачунају се само дани у којима је унета храна.</div>`;
  $('#view').innerHTML = L(h);
}
$('#view').addEventListener('click', e => {
  if (ui.tab !== 'stats') return;
  const b = e.target.closest('[data-n]'); if (b) { ui.statN = +b.dataset.n; renderStats(); }
});

$('#view').addEventListener('click', e => {

      ask('Сигурно? Последња провера.', 'Да, обриши', () => { S = defaults(); save(); ui.date = todayKey(); ui.tab = 'today'; render(); onboarding(); }));

function profileSheet(first) {

  const sh = openSheet(first ? 'Добро дошла! 👋' : 'Профил и циљеви', `
    ${first ? '<p class="muted small" style="margin-top:0">Попуни основне податке да апликација може да рачуна потрошњу. Све може касније да се промени. Ако већ имаш бекап, врати га доле.</p>' : ''}
    <div class="chips" id="psx"><button class="chip ${p.sex !== 'm' ? 'on' : ''}" data-x="f">Жена</button><button class="chip ${p.sex === 'm' ? 'on' : ''}" data-x="m">Мушкарац</button></div>

    <div class="grid2"><div><label class="f">Циљ уноса (kcal)</label><input type="text" inputmode="numeric" id="pt" value="${p.target || ''}" placeholder="предлог: ${suggestTarget(w)}"></div>

    `${first ? '' : '<button class="btn" data-close>Откажи</button>'}<button class="btn primary" id="pok">Сачувај</button>`);
  let sex = p.sex || 'f';

    const old = S.profile; S.profile = tmp;

    S.profile = old;
  };
  info();
  sh.addEventListener('input', info);
  sh.addEventListener('change', info);
  $('#psx', sh).addEventListener('click', e => { const b = e.target.closest('[data-x]'); if (!b) return; sex = b.dataset.x; $$('#psx .chip', sh).forEach(x => x.classList.toggle('on', x === b)); info(); });
  if (first) {
    $('#pimp', sh).onclick = () => $('#pimpf', sh).click();
    $('#pimpf', sh).onchange = e => { const f = e.target.files[0]; if (f) { closeSheet(); importBackup(f); } };
  }
  $('#pok', sh).onclick = () => {
    const age = num($('#pa', sh).value), h = num($('#ph', sh).value);
    if (!(age > 10 && age < 110)) return toast('Упиши године');
    if (!(h > 100 && h < 230)) return toast('Упиши висину у cm');
    const wv = num($('#pw', sh).value);
    Object.assign(S.profile, {
      sex, age: Math.round(age), height: Math.round(h), weight: wv > 25 && wv < 300 ? wv : null, level: +$('#pl', sh).value,
      target: num($('#pt', sh).value) >= 800 ? Math.round(num($('#pt', sh).value)) : null,
      protMin: num($('#ppl', sh).value) > 0 ? Math.round(num($('#ppl', sh).value)) : null,
      protMax: num($('#pph', sh).value) > 0 ? Math.round(num($('#pph', sh).value)) : null,
      water: num($('#pwa', sh).value) > 0 ? Math.round(num($('#pwa', sh).value)) : 2250,
      glass: num($('#pg', sh).value) > 0 ? Math.round(num($('#pg', sh).value)) : 250
    });
    S.settings.onboarded = true;
    save(); closeSheet(); render();
    if (first) toast('Спремно! Додај редовне тренинге у Подешавањима.');
  };
}

function routineSheet(id) {
  const ex = id ? S.routines.find(r => r.id === id) : null;
  const r = ex ? JSON.parse(JSON.stringify(ex)) : { id: uid(), act: ACTS[0].name, name: ACTS[0].name, met: ACTS[0].met, min: 40, days: [0, 1, 2, 3, 4, 5, 6] };
  const sh = openSheet(ex ? 'Измени тренинг' : 'Нови редовни тренинг', `
    <label class="f">Врста</label><select id="rs">${ACTS.map((x, i) => `<option value="${i}" ${x.name === (r.act || r.name) ? 'selected' : ''}>${esc(x.name)}</option>`).join('')}</select>
    <label class="f">Назив (како га ти зовеш)</label><input type="text" id="rn" value="${esc(r.name)}">
    <label class="f">Трајање (мин)</label><input type="text" inputmode="numeric" id="rm" value="${r.min}">
    <label class="f">Дани</label>
    <div class="chips" id="rd">${DAY_SHORT.map((d, i) => `<button class="chip ${r.days.includes(i) ? 'on' : ''}" data-d="${i}">${d}</button>`).join('')}</div>
    <div class="note" id="rinfo"></div>
    ${ex ? '<button class="btn danger block" id="rdel">Обриши</button>' : ''}`,
    `<button class="btn" data-close>Откажи</button><button class="btn primary" id="rok">Сачувај</button>`);
  const sel = $('#rs', sh), nm = $('#rn', sh);
  let lastAuto = L(ACTS[+sel.value]?.name);
  const info = () => { $('#rinfo', sh).innerHTML = L(`≈ <b>${fmt(actKcal(ACTS[+sel.value].met, num($('#rm', sh).value) || 0, weightOn(todayKey())))}</b> kcal по тренингу`); };
  info();
  sel.onchange = () => { const x = ACTS[+sel.value]; if (!nm.value.trim() || nm.value === lastAuto) nm.value = L(x.name); lastAuto = L(x.name); info(); };
  $('#rm', sh).oninput = info;
  $('#rd', sh).addEventListener('click', e => { const b = e.target.closest('[data-d]'); if (b) b.classList.toggle('on'); });
  if (ex) $('#rdel', sh).onclick = () => { S.routines = S.routines.filter(x => x.id !== r.id); save(); closeSheet(); render(); };
  $('#rok', sh).onclick = () => {
    r.met = ACTS[+sel.value].met;
    r.act = ACTS[+sel.value].name;
    r.name = nm.value.trim() || ACTS[+sel.value].name;
    r.min = Math.round(num($('#rm', sh).value));
    r.days = $$('#rd .on', sh).map(b => +b.dataset.d);
    if (!(r.min > 0)) return toast('Упиши трајање');
    if (!r.days.length) return toast('Изабери бар један дан');
    const i = S.routines.findIndex(x => x.id === r.id);
    if (i >= 0) S.routines[i] = r; else S.routines.push(r);
    save(); closeSheet(); render();
  };
}

/* ================= бекап ================= */
function exportBackup() {
  const d = new Date();
  const name = `fit-dnevnik-${keyOf(d)}.json`;
  const text = JSON.stringify({ app: 'fit-dnevnik', v: 1, exported: d.toISOString(), data: S }, null, 1);
  S.settings.lastBackup = Date.now(); save();
  if (window.FitAndroid && window.FitAndroid.saveFile) {
    window.FitAndroid.saveFile(name, text);
  } else {
    const a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' }));
    a.download = name; document.body.appendChild(a); a.click();
    setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1000);
    toast('Бекап је сачуван');
  }
  render();
}
function importBackup(file) {
  const rd = new FileReader();
  rd.onload = () => {
    let j;
    try { j = JSON.parse(rd.result); } catch (e) { return toast('Фајл није исправан бекап'); }
    const data = j && j.app === 'fit-dnevnik' ? j.data : j;
    if (!data || typeof data.days !== 'object') return toast('Фајл није бекап Фит дневника');
    const nd = Object.keys(data.days).length;
    ask(`Вратити бекап (${nd} дана)? Тренутни подаци на телефону биће замењени.`, 'Врати', () => {
      S = normalize(data); S.settings.onboarded = true; save();
      ui.date = todayKey(); ui.tab = 'today'; render();
      toast('Бекап је враћен ✓');
    }, false);
  };
  rd.readAsText(file);
}

/* ================= старт ================= */
function onboarding() { if (!S.settings.onboarded) profileSheet(true); }
render();
onboarding();
// нови дан после поноћи ако је апликација остала отворена
let lastToday = todayKey();
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  const t = todayKey();
  if (t !== lastToday) { if (ui.date === lastToday) ui.date = t; lastToday = t; }
  render();
});
</script>
