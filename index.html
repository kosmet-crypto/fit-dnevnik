<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111014">
<title>Фит дневник</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 108 108'%3E%3Crect width='108' height='108' rx='24' fill='%23f2677a'/%3E%3Cpath fill='%23fff' d='M54,78C54,78 30,63.5 30,46.5C30,38.5 36,33 43,33C47.8,33 51.6,35.6 54,39.4C56.4,35.6 60.2,33 65,33C72,33 78,38.5 78,46.5C78,63.5 54,78 54,78Z'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#111014; --surface:#1b1a20; --surface2:#25232c; --line:#302e38;
  --text:#f5f3f7; --muted:#9d98a8; --faint:#6d6878;
  --accent:#ff7a8a; --accent-ink:#1a0d10; --accent-soft:rgba(255,122,138,.15);
  --pos:#4fd6a0; --pos-soft:rgba(79,214,160,.14);
  --warn:#ffb35c; --warn-soft:rgba(255,179,92,.14);
  --prot:#8fa3ff; --prot-soft:rgba(143,163,255,.16);
  --water:#5cc8ff; --water-soft:rgba(92,200,255,.14);
  --shadow:0 18px 40px -18px rgba(0,0,0,.75);
  --font:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;
}
@media (prefers-color-scheme: light){
  :root:not([data-theme="dark"]){
    --bg:#f7f3f1; --surface:#ffffff; --surface2:#f1ebe8; --line:#e7dfdb;
    --text:#1f1b24; --muted:#6f6879; --faint:#9a93a2;
    --accent:#e0506a; --accent-ink:#fff; --accent-soft:rgba(224,80,106,.1);
    --pos:#178a60; --pos-soft:rgba(23,138,96,.1);
    --warn:#b86a0c; --warn-soft:rgba(184,106,12,.1);
    --prot:#4a61d1; --prot-soft:rgba(74,97,209,.1);
    --water:#1a86be; --water-soft:rgba(26,134,190,.1);
    --shadow:0 14px 30px -18px rgba(60,30,40,.35);
  }
}
:root[data-theme="light"]{
  --bg:#f7f3f1; --surface:#ffffff; --surface2:#f1ebe8; --line:#e7dfdb;
  --text:#1f1b24; --muted:#6f6879; --faint:#9a93a2;
  --accent:#e0506a; --accent-ink:#fff; --accent-soft:rgba(224,80,106,.1);
  --pos:#178a60; --pos-soft:rgba(23,138,96,.1);
  --warn:#b86a0c; --warn-soft:rgba(184,106,12,.1);
  --prot:#4a61d1; --prot-soft:rgba(74,97,209,.1);
  --water:#1a86be; --water-soft:rgba(26,134,190,.1);
  --shadow:0 14px 30px -18px rgba(60,30,40,.35);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.4}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
h1,h2,h3{margin:0;font-weight:750;letter-spacing:-.01em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)} .faint{color:var(--faint)} .small{font-size:13px} .tiny{font-size:12px}
.num{font-variant-numeric:tabular-nums}
.pos{color:var(--pos)} .warn{color:var(--warn)} .prot{color:var(--prot)}

/* header */
#top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(10px + env(safe-area-inset-top)) 0 6px}
.topbar{display:flex;align-items:center;gap:8px;min-height:44px}
.topbar h1{font-size:22px;flex:1}
.datenav{display:flex;align-items:center;gap:4px;flex:1;min-width:0}
.datenav .dt{flex:1;text-align:center;min-width:0}
.datenav .dt b{display:block;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.datenav .dt span{font-size:12px;color:var(--muted)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);color:var(--text);flex:none}
.iconbtn:disabled{opacity:.3}
.iconbtn svg{width:20px;height:20px}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-top:8px}
.wd{display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0 7px;border-radius:12px;color:var(--muted);font-size:11px}
.wd b{font-size:15px;color:var(--text);font-weight:650}
.wd i{width:6px;height:6px;border-radius:50%;background:var(--line)}
.wd i.ok{background:var(--pos)} .wd i.over{background:var(--warn)}
.wd.sel{background:var(--surface)} .wd.sel b{color:var(--accent)}
.wd:disabled{opacity:.35}

/* cards */
.card{background:var(--surface);border-radius:20px;padding:16px;margin:12px 0}
.card h2{font-size:16px}
.card-head{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.sec{display:flex;align-items:baseline;justify-content:space-between;margin:22px 4px 8px}
.sec h2{font-size:17px}
.linkbtn{color:var(--accent);font-weight:650;font-size:14px;padding:6px 2px}

.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px;align-items:center}
.ringbox{position:relative;display:grid;place-items:center}
.ringbox svg{width:100%;max-width:150px;height:auto;display:block}
.ringbox .rc{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.rc b{font-size:24px;font-weight:800;line-height:1.1}
.rc span{font-size:12px;color:var(--muted)}
.rc em{font-style:normal;font-size:12px;font-weight:650;margin-top:2px}
.ringlabel{text-align:center;font-size:13px;color:var(--muted);margin-top:2px}

.balance{display:flex;align-items:center;justify-content:space-between;gap:12px}
.bigval{font-size:30px;font-weight:800;line-height:1}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:99px;font-size:12px;font-weight:650;background:var(--surface2);color:var(--muted)}
.pill.pos{background:var(--pos-soft);color:var(--pos)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.breakdown{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.weekline{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);font-size:14px}

.tip{display:flex;gap:12px;align-items:flex-start;background:var(--accent-soft);border-radius:18px;padding:14px 16px;margin:12px 0}
.tip .em{font-size:22px;line-height:1.2}
.tip p{margin:0;font-size:15px}
.tip p + p{margin-top:6px}

.routine{display:flex;flex-direction:column;gap:10px;border:1.5px dashed var(--line);border-radius:18px;padding:14px;margin:10px 0}
.routine .rt{display:flex;justify-content:space-between;gap:8px;align-items:center}
.routine .rt b{font-size:15px}
.btnrow{display:flex;gap:8px}
.btnrow > *{flex:1}

.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:var(--surface);border-radius:18px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:92px}
.tile .tl{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:6px}
.tile .tv{font-size:22px;font-weight:800}
.tile .ts{font-size:12px;color:var(--muted)}
.water-ctrl{display:flex;align-items:center;gap:8px;margin-top:auto}
.water-ctrl button{width:34px;height:34px;border-radius:11px;background:var(--water-soft);color:var(--water);font-size:20px;font-weight:700}
.bar{height:6px;border-radius:6px;background:var(--surface2);overflow:hidden;margin-top:4px}
.bar i{display:block;height:100%;border-radius:6px}

.meal{background:var(--surface);border-radius:18px;margin:10px 0;overflow:hidden}
.meal-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:12px 14px 6px;width:100%;text-align:left}
.meal-h b{font-size:15px}
.meal-h .mt{font-size:13px;color:var(--muted)}
.meal ul{list-style:none;margin:0;padding:0 14px 10px}
.meal li{display:flex;justify-content:space-between;gap:10px;font-size:14px;padding:3px 0;color:var(--muted)}
.meal li span:first-child{color:var(--text);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meal li span:last-child{white-space:nowrap}
.meal-actions{display:flex;gap:4px;padding:0 10px 10px}
.meal-actions button{font-size:13px;color:var(--muted);padding:6px 8px;border-radius:10px;background:var(--surface2)}

.row{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--surface);border-radius:16px;margin:8px 0;width:100%;text-align:left}
.row .grow{flex:1;min-width:0}
.row .grow b{display:block;font-size:15px;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .grow span{font-size:13px;color:var(--muted)}
.row .end{text-align:right;font-size:14px;white-space:nowrap}
.row .end small{display:block;color:var(--muted);font-size:12px}
.badge{font-size:10.5px;font-weight:700;padding:2px 6px;border-radius:6px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:2px;text-transform:uppercase;letter-spacing:.03em}

.moods{display:flex;justify-content:space-between;gap:6px}
.moods button{flex:1;font-size:26px;padding:8px 0;border-radius:14px;background:var(--surface2);filter:grayscale(.85);opacity:.6}
.moods button.on{filter:none;opacity:1;background:var(--accent-soft);outline:2px solid var(--accent)}
textarea,input[type=text],input[type=number],input[type=search],input[type=time],input[type=date],select,input:not([type]){
  width:100%;background:var(--surface2);border:1.5px solid transparent;border-radius:14px;padding:12px 14px;outline:none;font-size:16px}
textarea:focus,input:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical;min-height:70px}
label.f{display:block;font-size:13px;color:var(--muted);margin:12px 0 6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:10px 16px;border-radius:14px;background:var(--surface2);font-weight:650;font-size:15px}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.pos{background:var(--pos-soft);color:var(--pos)}
.btn.warn{background:var(--warn-soft);color:var(--warn)}
.btn.ghost{background:transparent;color:var(--muted)}
.btn.danger{background:transparent;color:var(--warn);border:1.5px solid var(--warn-soft)}
.btn.block{width:100%}
.btn.sm{min-height:36px;padding:6px 12px;font-size:14px;border-radius:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 12px;border-radius:99px;background:var(--surface2);font-size:14px;font-weight:600;color:var(--muted)}
.chip.on{background:var(--accent);color:var(--accent-ink)}
.chips.scroll{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:0 16px}
.chips.scroll::-webkit-scrollbar{display:none}
.chips.scroll .chip{flex:none}

/* tabs */
#tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
#tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
#tabs button{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 10px;font-size:11.5px;font-weight:650;color:var(--faint)}
#tabs button svg{width:23px;height:23px}
#tabs button.on{color:var(--accent)}
#fab{position:fixed;right:max(16px,calc(50% - 264px));bottom:calc(82px + env(safe-area-inset-bottom));z-index:31;height:56px;padding:0 22px 0 18px;border-radius:18px;background:var(--accent);color:var(--accent-ink);font-weight:750;font-size:16px;display:flex;align-items:center;gap:8px;box-shadow:var(--shadow)}
#fab svg{width:22px;height:22px}

/* sheets */
.backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .15s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;border-radius:24px 24px 0 0;display:flex;flex-direction:column;animation:up .2s ease-out;box-shadow:var(--shadow)}
.sheet-h{display:flex;align-items:center;gap:10px;padding:16px 16px 8px}
.sheet-h h3{flex:1;font-size:18px}
.sheet-b{overflow-y:auto;padding:4px 16px 16px;-webkit-overflow-scrolling:touch}
.sheet-f{padding:10px 16px calc(14px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:8px}
.sheet-f > *{flex:1}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.sumline{display:flex;flex-wrap:wrap;gap:4px 12px;justify-content:space-between;align-items:center;padding:12px 14px;border-radius:14px;background:var(--surface);margin:10px 0;font-weight:650}
.qty-big{display:flex;align-items:baseline;gap:8px;justify-content:center;margin:14px 0 6px}
.qty-big b{font-size:34px;font-weight:800}
.item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:14px;background:var(--surface);margin:6px 0}
.item .grow{flex:1;min-width:0}
.item .grow b{display:block;font-weight:600;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .grow span{font-size:13px;color:var(--muted)}
.item .x{width:32px;height:32px;border-radius:10px;color:var(--muted);font-size:20px}
.res{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:11px 4px;border-bottom:1px solid var(--line)}
.res .grow{flex:1;min-width:0}
.res .grow b{display:block;font-weight:600;font-size:15px}
.res .grow span{font-size:12.5px;color:var(--muted)}
.res .end{font-size:13px;color:var(--muted);text-align:right;white-space:nowrap}
.gh{font-size:12px;font-weight:750;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);margin:16px 4px 4px}
.actions3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0}
.actions3 .btn{flex-direction:column;gap:2px;font-size:13px;padding:10px 4px;min-height:58px}
.actions3 .btn span{font-size:20px}
.note{font-size:13px;color:var(--muted);background:var(--surface);border-radius:14px;padding:10px 12px;margin:10px 0}
.empty{text-align:center;color:var(--muted);padding:26px 12px;font-size:14px}
.banner{display:flex;align-items:center;gap:10px;background:var(--warn-soft);color:var(--text);border-radius:16px;padding:10px 12px;margin:10px 0;font-size:14px}
.banner .grow{flex:1}

/* stats */
.stat-tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.st{background:var(--surface);border-radius:18px;padding:14px}
.st .l{font-size:12.5px;color:var(--muted)}
.st .v{font-size:24px;font-weight:800;margin-top:2px}
.st .s{font-size:12px;color:var(--muted);margin-top:2px}
.chart{margin-top:6px}
.chart-tip{font-size:13px;color:var(--muted);min-height:20px;margin-bottom:4px}
.chart-tip b{color:var(--text)}
.chart svg{width:100%;height:auto;display:block;overflow:visible}
.chart text{font-size:10px;fill:var(--faint);font-family:var(--font)}
.chart .col{fill:transparent}
.chart .col.on{fill:var(--surface2)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th{text-align:left;font-size:12px;color:var(--muted);font-weight:650;padding:6px 4px;border-bottom:1px solid var(--line)}
table.t td{padding:8px 4px;border-bottom:1px solid var(--line)}
table.t td.r,table.t th.r{text-align:right}

#toast{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:14px;font-size:14px;font-weight:600;z-index:100;opacity:0;pointer-events:none;transition:opacity .2s;max-width:88vw;text-align:center}
#toast.show{opacity:1}
video.scan{width:100%;border-radius:16px;background:#000;aspect-ratio:4/3;object-fit:cover}
.hidden{display:none!important}
</style>
</head>
<body>
<header id="top"><div class="wrap" id="topin"></div></header>
<main class="wrap" id="view"></main>
<button id="fab" class="hidden"></button>
<nav id="tabs"><div class="in" id="tabsin"></div></nav>
<div id="toast"></div>

<script src="foods.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
